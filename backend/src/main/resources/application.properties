# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eco_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Admin bootstrap
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.admin.first-name=Amit
app.bootstrap.admin.last-name=Soam
app.bootstrap.seed-sample-data=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=ecommerce/products

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Mail
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Google OAuth
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/oauth2/callback}

# Gmail OAuth for OTP
gmail.oauth.credentials-path=${GMAIL_OAUTH_CREDENTIALS_PATH:${user.dir}/gmail-oauth/credentials.json}
gmail.oauth.token-store-path=${GMAIL_OAUTH_TOKEN_STORE_PATH:${user.dir}/gmail-oauth/oauth-tokens}
gmail.sender=${GMAIL_SENDER}